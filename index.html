<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Nav Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b2a; --navy2: #152235; --navy3: #1e3050;
    --gold: #c9a84c; --cream: #f5f0e8; --text2: #b0c0d0;
    --green: #4caf82; --red: #e05c5c; --radius: 12px;
  }
  body { background: var(--navy); color: var(--cream); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

  .header { text-align: center; margin-bottom: 25px; }
  .header-title { font-family: 'Playfair Display', serif; font-size: 28px; line-height: 1.1; }

  .small-btn, .btn { padding: 12px 20px; background: var(--gold); color: #0d1b2a; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-red { background: var(--red); color: white; }
  .small-btn { font-size: 13px; }

  .settings-panel { background: var(--navy2); padding: 24px; border-radius: var(--radius); margin: 15px 0; }
  .form-label { font-size: 13px; color: var(--gold); margin: 16px 0 8px; display: block; }
  .form-input { width: 100%; padding: 14px; background: var(--navy3); border: 1px solid #334766; border-radius: 8px; color: white; font-size: 15px; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 14px 24px; border-radius: 999px; z-index: 999; opacity: 0; transition: 0.4s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">General Navigation<br>Answer Keys</div>
  </div>

  <div style="text-align:center; margin-bottom:20px;">
    <button class="small-btn" onclick="showSettings()">⚙️ GitHub Settings</button>
  </div>

  <div id="tabs"></div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let config = { token: "", owner: "", repo: "gennav-keys", branch: "main", filename: "gennav-keys.json" };
let papers = [];
let activeTab = "apr";

const SEED = [
  { id: 'apr', title: 'April Batch', code: 'GN-APR-2025', answers: ['C','C','C','B','D','C','B','C','B','B','B','D','C','D','D','A','D','D','B','B','C','D','D','D','B'] },
  { id: 'may', title: 'May Batch', code: 'GN-MAY-2025', answers: ['C','C','B','C','A','D','A','C','B','B','A','B','C','B','D','B','C','C','B','C'] }
];

function loadConfig() {
  const saved = localStorage.getItem("gennav_config");
  if (saved) config = JSON.parse(saved);
}
function saveConfig() {
  localStorage.setItem("gennav_config", JSON.stringify(config));
}

async function githubRequest(method = "GET", body = null) {
  if (!config.token || !config.owner || !config.repo) throw new Error("Not configured");
  
  const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filename}`;
  const res = await fetch(method === "GET" ? url + `?ref=${config.branch}` : url, {
    method: method,
    headers: {
      "Authorization": `token ${config.token}`,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });

  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub Error ${res.status} - Check token permissions`);
  return res.json();
}

window.showSettings = function() {
  document.getElementById("content").innerHTML = `
    <div class="settings-panel">
      <h3 style="color:#c9a84c">GitHub Settings</h3>
      <div class="form-label">Token (github_pat_...)</div>
      <input class="form-input" id="g-token" type="password" value="${config.token}">
      <div class="form-label">GitHub Username</div>
      <input class="form-input" id="g-owner" value="${config.owner}">
      <div class="form-label">Repository Name</div>
      <input class="form-input" id="g-repo" value="${config.repo}">
      <button class="btn" onclick="saveSettings()">Save & Test Connection</button>
    </div>`;
};

window.saveSettings = async function() {
  config.token = document.getElementById("g-token").value.trim();
  config.owner = document.getElementById("g-owner").value.trim();
  config.repo = document.getElementById("g-repo").value.trim();
  saveConfig();

  showToast("Testing connection...");
  
  try {
    await githubRequest("GET");
    showToast("✅ Successfully connected to GitHub!");
    setTimeout(() => loadFromGitHub(), 1000);
  } catch(e) {
    showToast("❌ Connection failed. " + e.message);
  }
};

async function loadFromGitHub() {
  try {
    const data = await githubRequest("GET");
    if (data) {
      papers = JSON.parse(atob(data.content));
      showToast("✅ Loaded from GitHub");
    } else {
      papers = [...SEED];
    }
  } catch(e) {
    papers = [...SEED];
    showToast("⚠️ Using local data");
  }
  render();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

function render() {
  document.getElementById("content").innerHTML = `<p style="text-align:center; padding:50px; color:#888;">${papers.length} papers loaded.<br><br>Try editing or adding a paper.</p>`;
}

// Start
loadConfig();
loadFromGitHub();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Nav — Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b2a; --navy2: #152235; --navy3: #1e3050;
    --gold: #c9a84c; --gold2: #e8c97a; --cream: #f5f0e8;
    --slate: #8fa3b8; --text: #e8e0d5; --text2: #b0c0d0;
    --green: #4caf82; --red: #e05c5c; --radius: 12px;
  }
  body { background: var(--navy); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 24px 16px 80px; }

  .header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
  .header-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--cream); line-height: 1.15; }
  .header-sub { font-size: 12px; color: var(--text2); margin-top: 6px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-family: 'DM Mono', monospace; font-size: 11px; padding: 8px 16px; border-radius: 30px; border: 1px solid var(--navy3); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
  .tab.active { background: var(--gold); color: #0d1b2a; border-color: var(--gold); font-weight: 500; }
  .tab:hover:not(.active) { border-color: var(--slate); color: var(--cream); }
  .tab-add { border-style: dashed; }

  .paper-card { background: var(--navy2); border: 1px solid var(--navy3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
  .paper-header { padding: 16px 18px 14px; border-bottom: 1px solid var(--navy3); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .paper-title { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--cream); }
  .paper-meta { font-size: 11px; color: var(--text2); margin-top: 3px; font-family: 'DM Mono', monospace; }
  .paper-badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 20px; background: var(--navy3); color: var(--gold); flex-shrink: 0; }

  .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--navy3); }
  .answer-cell { background: var(--navy2); padding: 12px 6px; text-align: center; transition: background 0.15s; }
  .answer-cell:hover { background: var(--navy3); }
  .cell-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text2); margin-bottom: 4px; }
  .cell-ans { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--gold); }

  .stats-bar { padding: 14px 18px; display: flex; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--navy3); }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }
  .stat-val { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--cream); font-weight: 500; }

  .add-form { background: var(--navy2); border: 1px dashed var(--navy3); border-radius: var(--radius); padding: 20px; }
  .form-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cream); margin-bottom: 18px; }
  .form-row { margin-bottom: 14px; }
  .form-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--navy3); border: 1px solid #2a4060; border-radius: 8px; padding: 10px 12px; color: var(--cream); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--gold); }
  .form-input::placeholder { color: #5a7a96; }
  textarea.form-input { min-height: 130px; resize: vertical; line-height: 1.8; }
  .form-hint { font-size: 11px; color: var(--text2); margin-top: 5px; }
  .btn-save { width: 100%; padding: 12px; background: var(--gold); color: #0d1b2a; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
  .btn-save:hover { background: var(--gold2); }
  .btn-delete { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--red); background: none; border: 1px solid rgba(224,92,92,0.3); border-radius: 20px; cursor: pointer; padding: 6px 14px; opacity: 0.8; transition: opacity 0.2s; }
  .btn-delete:hover { opacity: 1; }
  .delete-row { text-align: center; margin-top: 10px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; font-family: 'DM Mono', monospace; font-size: 12px; padding: 10px 22px; border-radius: 30px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-eyebrow">DGCA · CPL / ATPL</div>
    <div class="header-title">General Navigation<br>Answer Keys</div>
    <div class="header-sub">Tap any batch to view &nbsp;·&nbsp; Add future papers anytime</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SEED = [
  { id:'apr', title:'April Batch', code:'GN-APR-2025',
    answers:['C','C','C','B','D','C','B','C','B','B','B','D','C','D','D','A','D','D','B','B','C','D','D','D','B'] },
  { id:'may', title:'May Batch', code:'GN-MAY-2025',
    answers:['C','C','B','C','A','D','A','C','B','B','A','B','C','B','D','B','C','C','B','C'] }
];
const KEY = 'gennav_site_v1';
let papers = [], activeTab = 'apr';

function load() {
  try { const r = localStorage.getItem(KEY); papers = r ? JSON.parse(r) : [...SEED]; }
  catch { papers = [...SEED]; }
  render();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(papers)); } catch {} }

function parseAnswers(raw) {
  return raw.trim().split('\n')
    .map(l => { const m = l.trim().match(/^\d+\s*[.:\-]?\s*([A-Da-d])/); return m ? m[1].toUpperCase() : null; })
    .filter(Boolean);
}
function dotColor(l) { return {A:'#4caf82',B:'#c9a84c',C:'#6ab0e8',D:'#e05c5c'}[l]; }

function render() {
  const tabEl = document.getElementById('tabs');
  tabEl.innerHTML = '';
  papers.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab' + (p.id === activeTab ? ' active' : '');
    b.textContent = p.title;
    b.onclick = () => { activeTab = p.id; render(); };
    tabEl.appendChild(b);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tab tab-add' + (activeTab === '__add__' ? ' active' : '');
  addBtn.textContent = '+ New Paper';
  addBtn.onclick = () => { activeTab = '__add__'; render(); };
  tabEl.appendChild(addBtn);

  const el = document.getElementById('content');
  if (activeTab === '__add__') {
    el.innerHTML = `
      <div class="add-form">
        <div class="form-title">Add New Answer Key</div>
        <div class="form-row">
          <label class="form-label">Batch Name</label>
          <input class="form-input" id="f-title" placeholder="e.g. June Batch" />
        </div>
        <div class="form-row">
          <label class="form-label">Paper Code <span style="color:#5a7a96;font-size:10px;">(optional)</span></label>
          <input class="form-input" id="f-code" placeholder="e.g. GN-JUN-2025" />
        </div>
        <div class="form-row">
          <label class="form-label">Paste Answer Key</label>
          <textarea class="form-input" id="f-answers" placeholder="1C&#10;2A&#10;3B&#10;&#10;or&#10;&#10;1 C&#10;2 A&#10;3 B"></textarea>
          <div class="form-hint">Any format works — 1C &nbsp;·&nbsp; 1 C &nbsp;·&nbsp; 1. C &nbsp;·&nbsp; 1: C</div>
        </div>
        <button class="btn-save" onclick="addPaper()">Save Answer Key</button>
      </div>`;
    return;
  }
  const paper = papers.find(p => p.id === activeTab);
  if (!paper) { el.innerHTML = ''; return; }
  const counts = {A:0,B:0,C:0,D:0};
  paper.answers.forEach(a => counts[a] = (counts[a]||0)+1);
  const grid = paper.answers.map((a,i) =>
    `<div class="answer-cell"><div class="cell-num">Q${i+1}</div><div class="cell-ans">${a}</div></div>`).join('');
  const stats = ['A','B','C','D'].map(l =>
    `<div class="stat-item"><div class="stat-dot" style="background:${dotColor(l)}"></div><span class="stat-label">${l}</span><span class="stat-val">${counts[l]||0}</span></div>`).join('');
  el.innerHTML = `
    <div class="paper-card">
      <div class="paper-header">
        <div>
          <div class="paper-title">${paper.title}</div>
          <div class="paper-meta">${paper.code} &nbsp;·&nbsp; ${paper.answers.length} questions</div>
        </div>
        <span class="paper-badge">${paper.answers.length} Qs</span>
      </div>
      <div class="answer-grid">${grid}</div>
      <div class="stats-bar">${stats}</div>
    </div>
    <div class="delete-row">
      <button class="btn-delete" onclick="deletePaper('${paper.id}')">✕ Delete this paper</button>
    </div>`;
}

function addPaper() {
  const title = document.getElementById('f-title').value.trim();
  const code  = document.getElementById('f-code').value.trim();
  const raw   = document.getElementById('f-answers').value.trim();
  if (!title || !raw) { showToast('Fill in batch name and answers'); return; }
  const answers = parseAnswers(raw);
  if (!answers.length) { showToast('Could not parse any answers'); return; }
  const id = 'p_' + Date.now();
  papers.push({ id, title, code: code || title, answers });
  save(); activeTab = id; render();
  showToast('✓ ' + answers.length + ' answers saved');
}

function deletePaper(id) {
  if (!confirm('Delete this paper?')) return;
  papers = papers.filter(p => p.id !== id);
  activeTab = papers.length ? papers[0].id : '__add__';
  save(); render(); showToast('Paper deleted');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

load();
</script>
</body>
</html>

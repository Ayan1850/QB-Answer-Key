<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Nav Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b2a; --navy2: #152235; --navy3: #1e3050;
    --gold: #c9a84c; --cream: #f5f0e8; --text2: #b0c0d0;
    --green: #4caf82; --red: #e05c5c; --radius: 12px;
  }
  body { background: var(--navy); color: var(--cream); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

  .header { text-align: center; margin-bottom: 20px; }
  .header-title { font-family: 'Playfair Display', serif; font-size: 28px; line-height: 1.1; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
  .tab { font-family: 'DM Mono', monospace; padding: 8px 16px; border-radius: 30px; border: 1px solid var(--navy3); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gold); color: #0d1b2a; border-color: var(--gold); font-weight: 500; }

  .paper-card { background: var(--navy2); border: 1px solid var(--navy3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
  .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--navy3); }
  .answer-cell { background: var(--navy2); padding: 12px 6px; text-align: center; cursor: pointer; }
  .cell-num { font-size: 10px; color: var(--text2); }
  .cell-ans { font-size: 22px; font-weight: 600; color: var(--gold); }

  .btn, .small-btn { padding: 12px; background: var(--gold); color: #0d1b2a; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-red { background: var(--red); color: white; }
  .small-btn { padding: 8px 14px; font-size: 13px; }

  .settings-panel { background: var(--navy2); padding: 20px; border-radius: var(--radius); }
  .form-label { display: block; margin: 15px 0 6px; color: var(--gold); font-size: 13px; }
  .form-input { width: 100%; padding: 12px; background: var(--navy3); border: 1px solid #334766; border-radius: 8px; color: white; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 12px 24px; border-radius: 999px; z-index: 999; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">General Navigation<br>Answer Keys</div>
  </div>

  <div style="text-align:center; margin-bottom:15px;">
    <button class="small-btn" onclick="showSettings()">⚙️ GitHub Settings</button>
  </div>

  <div id="tabs"></div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let config = { token: "", owner: "", repo: "gennav-keys", branch: "main", filename: "gennav-keys.json" };
let papers = [];
let activeTab = "apr";
let editingPaperId = null;

const SEED = [
  { id: 'apr', title: 'April Batch', code: 'GN-APR-2025', answers: ['C','C','C','B','D','C','B','C','B','B','B','D','C','D','D','A','D','D','B','B','C','D','D','D','B'] },
  { id: 'may', title: 'May Batch', code: 'GN-MAY-2025', answers: ['C','C','B','C','A','D','A','C','B','B','A','B','C','B','D','B','C','C','B','C'] }
];

function loadConfig() { 
  const saved = localStorage.getItem("gennav_config"); 
  if (saved) config = JSON.parse(saved); 
}
function saveConfig() { 
  localStorage.setItem("gennav_config", JSON.stringify(config)); 
}

async function githubRequest(method = "GET", body = null) {
  if (!config.token || !config.owner || !config.repo) throw new Error("Not configured");
  const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.filename}`;
  const res = await fetch(method === "GET" ? url + `?ref=${config.branch}` : url, {
    method,
    headers: {
      "Authorization": `token ${config.token}`,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub Error ${res.status}`);
  return res.json();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

window.showSettings = function() {
  document.getElementById("content").innerHTML = `
    <div class="settings-panel">
      <h3 style="color:#c9a84c">GitHub Settings</h3>
      <div class="form-label">Token</div>
      <input class="form-input" id="g-token" type="password" value="${config.token}">
      <div class="form-label">Username</div>
      <input class="form-input" id="g-owner" value="${config.owner}">
      <div class="form-label">Repo Name</div>
      <input class="form-input" id="g-repo" value="${config.repo}">
      <button class="btn" onclick="saveSettings()">Save & Test</button>
    </div>`;
};

window.saveSettings = async function() {
  config.token = document.getElementById("g-token").value.trim();
  config.owner = document.getElementById("g-owner").value.trim();
  config.repo = document.getElementById("g-repo").value.trim();
  saveConfig();
  showToast("Testing...");
  try {
    await githubRequest("GET");
    showToast("✅ Connected!");
    setTimeout(loadFromGitHub, 800);
  } catch(e) { showToast("❌ Failed"); }
};

async function loadFromGitHub() {
  try {
    const data = await githubRequest("GET");
    if (data) papers = JSON.parse(atob(data.content));
    else papers = [...SEED];
  } catch(e) {
    papers = [...SEED];
  }
  render();
}

async function saveToGitHub() {
  try {
    let sha = null;
    const existing = await githubRequest("GET");
    if (existing) sha = existing.sha;

    const content = btoa(JSON.stringify(papers, null, 2));
    await githubRequest("PUT", {
      message: `Update ${new Date().toISOString().slice(0,16)}`,
      content: content,
      sha: sha,
      branch: config.branch
    });
    showToast("✅ Saved to GitHub");
  } catch(e) {
    showToast("⚠️ Saved locally");
  }
}

function save() {
  localStorage.setItem("gennav_papers", JSON.stringify(papers));
  saveToGitHub();
}

function parseAnswers(raw) {
  return raw.trim().split('\n')
    .map(l => l.trim().match(/([A-D])/i)?.[1]?.toUpperCase())
    .filter(Boolean);
}

function render() {
  // Tabs
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  papers.forEach(p => {
    const b = document.createElement('button');
    b.className = `tab ${p.id === activeTab ? 'active' : ''}`;
    b.textContent = p.title;
    b.onclick = () => { activeTab = p.id; editingPaperId = null; render(); };
    tabs.appendChild(b);
  });

  const addBtn = document.createElement('button');
  addBtn.className = `tab ${activeTab === '__add__' ? 'active' : ''}`;
  addBtn.textContent = '+ New Paper';
  addBtn.onclick = () => { activeTab = '__add__'; editingPaperId = null; render(); };
  tabs.appendChild(addBtn);

  const content = document.getElementById('content');
  if (activeTab === '__add__' || editingPaperId) {
    content.innerHTML = renderForm();
  } else {
    const paper = papers.find(p => p.id === activeTab);
    content.innerHTML = paper ? renderPaper(paper) : '<p>No paper</p>';
  }
}

function renderPaper(paper) {
  const grid = paper.answers.map((ans, i) => `
    <div class="answer-cell" onclick="editAnswer('${paper.id}', ${i})">
      <div class="cell-num">Q${i+1}</div>
      <div class="cell-ans">${ans}</div>
    </div>
  `).join('');

  return `
    <div class="paper-card">
      <div style="padding:16px; border-bottom:1px solid var(--navy3);">
        <strong>${paper.title}</strong><br>
        <small>${paper.code} • ${paper.answers.length} questions</small>
      </div>
      <div class="answer-grid">${grid}</div>
    </div>
    <button class="btn" onclick="startEdit('${paper.id}')">✏️ Edit Full Paper</button>
    <button class="btn btn-red" onclick="deletePaper('${paper.id}')">Delete Paper</button>
  `;
}

function renderForm() {
  const isEdit = !!editingPaperId;
  const paper = isEdit ? papers.find(p => p.id === editingPaperId) : null;
  return `
    <div class="settings-panel">
      <h3>${isEdit ? 'Edit Paper' : 'New Paper'}</h3>
      <div class="form-label">Batch Name</div>
      <input class="form-input" id="title" value="${paper?.title || ''}">
      <div class="form-label">Code</div>
      <input class="form-input" id="code" value="${paper?.code || ''}">
      <div class="form-label">Answers (one per line)</div>
      <textarea class="form-input" id="answers" rows="12">${paper ? paper.answers.map((a,i) => `${i+1} ${a}`).join('\n') : ''}</textarea>
      <button class="btn" onclick="${isEdit ? 'updatePaper()' : 'addPaper()'}">${isEdit ? 'Update' : 'Save'} Paper</button>
    </div>`;
}

window.addPaper = function() {
  const title = document.getElementById('title').value.trim();
  const code = document.getElementById('code').value.trim();
  const raw = document.getElementById('answers').value;
  const answers = parseAnswers(raw);
  if (!title || answers.length === 0) return showToast("Invalid input");
  const id = 'p_' + Date.now();
  papers.push({id, title, code: code || title, answers});
  save();
  activeTab = id;
  render();
  showToast("Paper saved");
};

window.startEdit = function(id) {
  editingPaperId = id;
  activeTab = '__add__';
  render();
};

window.updatePaper = function() {
  const paper = papers.find(p => p.id === editingPaperId);
  if (!paper) return;
  paper.title = document.getElementById('title').value.trim();
  paper.code = document.getElementById('code').value.trim();
  paper.answers = parseAnswers(document.getElementById('answers').value);
  save();
  editingPaperId = null;
  render();
  showToast("Paper updated");
};

window.deletePaper = function(id) {
  if (confirm("Delete this paper?")) {
    papers = papers.filter(p => p.id !== id);
    activeTab = papers[0]?.id || "apr";
    save();
    render();
  }
};

window.editAnswer = function(paperId, index) {
  const paper = papers.find(p => p.id === paperId);
  if (!paper) return;
  const newAns = prompt(`Q${index+1} (${paper.answers[index]}) → New answer (A/B/C/D):`, paper.answers[index]);
  if (newAns && /^[ABCD]$/i.test(newAns)) {
    paper.answers[index] = newAns.toUpperCase();
    save();
    render();
  }
};

// Start App
loadConfig();
loadFromGitHub();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Nav Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b2a; --navy2: #152235; --navy3: #1e3050;
    --gold: #c9a84c; --cream: #f5f0e8; --text2: #b0c0d0;
    --green: #4caf82; --red: #e05c5c; --radius: 12px;
  }
  body { background: var(--navy); color: var(--cream); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

  .header-title { font-family: 'Playfair Display', serif; font-size: 28px; text-align:center; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
  .tab { font-family: 'DM Mono', monospace; padding: 8px 16px; border-radius: 30px; border: 1px solid var(--navy3); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gold); color: #0d1b2a; border-color: var(--gold); font-weight: 500; }

  .paper-card { background: var(--navy2); border: 1px solid var(--navy3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
  .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--navy3); }
  .answer-cell { background: var(--navy2); padding: 12px 6px; text-align: center; cursor: pointer; }
  .cell-num { font-size: 10px; color: var(--text2); }
  .cell-ans { font-size: 22px; font-weight: 600; color: var(--gold); }

  .btn, .small-btn { padding: 12px; background: var(--gold); color: #0d1b2a; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-red { background: var(--red); color: white; }
  .small-btn { padding: 8px 14px; font-size: 13px; }

  .readonly-banner { background: #1e3050; color: #c9a84c; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
  .edit-banner { background: #4caf82; color: white; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 12px 24px; border-radius: 30px; z-index: 999; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header-title">General Navigation<br>Answer Keys</div>

  <div id="mode-banner"></div>

  <div style="text-align:center; margin:10px 0 20px;">
    <button class="small-btn" onclick="showSettings()">⚙️ Settings</button>
    <button class="small-btn" onclick="forceRefresh()" style="margin-left:8px;">🔄 Refresh</button>
  </div>

  <div id="tabs"></div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== CONFIG ==============
const USERNAME = "Ayan1850";
const REPO = "QB-Answer-Key";
const PUBLIC_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/gennav-keys.json`;

let config = { token: "", owner: USERNAME, repo: REPO, branch: "main", filename: "gennav-keys.json" };
let papers = [];
let activeTab = "apr";
let editingPaperId = null;
let isReadOnly = true;

const SEED = [
  { id: 'apr', title: 'April Batch', code: 'GN-APR-2025', answers: ['C','C','C','B','D','C','B','C','B','B','B','D','C','D','D','A','D','D','B','B','C','D','D','D','B'] },
  { id: 'may', title: 'May Batch', code: 'GN-MAY-2025', answers: ['C','C','B','C','A','D','A','C','B','B','A','B','C','B','D','B','C','C','B','C'] }
];

function loadConfig() {
  const saved = localStorage.getItem("gennav_config");
  if (saved) config = JSON.parse(saved);
}
function saveConfig() {
  localStorage.setItem("gennav_config", JSON.stringify(config));
}

async function githubRequest(method = "GET", body = null) {
  if (!config.token) throw new Error("No token");
  const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/gennav-keys.json`;
  const res = await fetch(method === "GET" ? url + `?ref=main` : url, {
    method,
    headers: {
      "Authorization": `token ${config.token}`,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub Error ${res.status}`);
  return res.json();
}

async function loadFromGitHub() {
  document.getElementById("mode-banner").innerHTML = `<div class="readonly-banner">Loading latest data...</div>`;

  // Try Edit Mode with Token
  if (config.token) {
    try {
      const data = await githubRequest("GET");
      if (data) {
        papers = JSON.parse(atob(data.content));
        isReadOnly = false;
        document.getElementById("mode-banner").innerHTML = `<div class="edit-banner">✏️ Editing Mode - Changes will sync across devices</div>`;
        render();
        return;
      }
    } catch(e) { console.log("Token failed", e); }
  }

  // Public Read-only
  try {
    const res = await fetch(PUBLIC_URL + "?t=" + Date.now());
    if (res.ok) papers = await res.json();
    else papers = [...SEED];
  } catch(e) {
    papers = [...SEED];
  }
  isReadOnly = true;
  document.getElementById("mode-banner").innerHTML = `<div class="readonly-banner">📖 Public View Mode</div>`;
  render();
}

async function saveToGitHub() {
  if (isReadOnly || !config.token) return;
  try {
    let sha = null;
    try {
      const existing = await githubRequest("GET");
      if (existing) sha = existing.sha;
    } catch(e) {}

    const content = btoa(JSON.stringify(papers, null, 2));
    await githubRequest("PUT", {
      message: `Update ${new Date().toISOString().slice(0,16)}`,
      content: content,
      sha: sha,
      branch: "main"
    });
    showToast("✅ Saved to GitHub");
  } catch(e) {
    showToast("⚠️ Save failed");
    console.error(e);
  }
}

function save() {
  localStorage.setItem("gennav_papers", JSON.stringify(papers));
  saveToGitHub();
}

function parseAnswers(raw) {
  return raw.trim().split('\n')
    .map(l => l.trim().match(/([A-D])/i)?.[1]?.toUpperCase())
    .filter(Boolean);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function forceRefresh() {
  showToast("Refreshing from GitHub...");
  loadFromGitHub();
}

// ================= UI RENDER =================
function render() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';

  papers.forEach(p => {
    const b = document.createElement('button');
    b.className = `tab ${p.id === activeTab ? 'active' : ''}`;
    b.textContent = p.title;
    b.onclick = () => { activeTab = p.id; editingPaperId = null; render(); };
    tabs.appendChild(b);
  });

  const addBtn = document.createElement('button');
  addBtn.className = `tab ${activeTab === '__add__' ? 'active' : ''}`;
  addBtn.textContent = isReadOnly ? 'View Only' : '+ New Paper';
  if (!isReadOnly) addBtn.onclick = () => { activeTab = '__add__'; editingPaperId = null; render(); };
  tabs.appendChild(addBtn);

  const content = document.getElementById('content');
  if (activeTab === '__add__' || editingPaperId) {
    content.innerHTML = renderForm();
  } else {
    const paper = papers.find(p => p.id === activeTab);
    content.innerHTML = paper ? renderPaper(paper) : '<p style="text-align:center;padding:60px;color:#666;">No paper selected</p>';
  }
}

function renderPaper(paper) {
  const grid = paper.answers.map((ans, i) => `
    <div class="answer-cell" onclick="${isReadOnly ? '' : `editAnswer('${paper.id}', ${i})`}">
      <div class="cell-num">Q${i+1}</div>
      <div class="cell-ans">${ans}</div>
    </div>
  `).join('');

  return `
    <div class="paper-card">
      <div style="padding:16px; border-bottom:1px solid var(--navy3);">
        <strong>${paper.title}</strong><br>
        <small>${paper.code} • ${paper.answers.length} questions</small>
      </div>
      <div class="answer-grid">${grid}</div>
    </div>
    ${isReadOnly ? '' : `
      <button class="btn" onclick="startEdit('${paper.id}')">✏️ Edit Full Paper</button>
      <button class="btn btn-red" onclick="deletePaper('${paper.id}')">Delete Paper</button>
    `}
  `;
}

function renderForm() {
  const isEdit = !!editingPaperId;
  const paper = isEdit ? papers.find(p => p.id === editingPaperId) : null;
  return `
    <div class="paper-card" style="padding:20px;">
      <h3>${isEdit ? 'Edit Paper' : 'Add New Paper'}</h3>
      <div style="margin:12px 0;">
        <label style="color:var(--gold);font-size:13px;">Batch Name</label>
        <input id="title" value="${paper?.title || ''}" style="width:100%;padding:12px;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      </div>
      <div style="margin:12px 0;">
        <label style="color:var(--gold);font-size:13px;">Paper Code</label>
        <input id="code" value="${paper?.code || ''}" style="width:100%;padding:12px;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      </div>
      <div style="margin:12px 0;">
        <label style="color:var(--gold);font-size:13px;">Answers (one per line)</label>
        <textarea id="answers" rows="15" style="width:100%;padding:12px;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">${paper ? paper.answers.map((a,i) => `${i+1} ${a}`).join('\n') : ''}</textarea>
      </div>
      <button class="btn" onclick="${isEdit ? 'updatePaper()' : 'addPaper()'}">${isEdit ? 'Update Paper' : 'Save Paper'}</button>
      ${isEdit ? `<button class="btn btn-red" onclick="cancelEdit()">Cancel</button>` : ''}
    </div>`;
}

// CRUD
window.addPaper = function() {
  const title = document.getElementById('title').value.trim();
  const code = document.getElementById('code').value.trim();
  const raw = document.getElementById('answers').value;
  const answers = parseAnswers(raw);
  if (!title || answers.length === 0) return showToast("Title and answers required");
  const id = 'p_' + Date.now();
  papers.push({id, title, code: code || title, answers});
  save();
  activeTab = id;
  render();
  showToast("✅ Paper Saved");
};

window.updatePaper = function() {
  const paper = papers.find(p => p.id === editingPaperId);
  if (!paper) return;
  paper.title = document.getElementById('title').value.trim();
  paper.code = document.getElementById('code').value.trim();
  paper.answers = parseAnswers(document.getElementById('answers').value);
  save();
  editingPaperId = null;
  render();
  showToast("✅ Paper Updated");
};

window.startEdit = function(id) {
  editingPaperId = id;
  activeTab = '__add__';
  render();
};

window.cancelEdit = function() {
  editingPaperId = null;
  render();
};

window.deletePaper = function(id) {
  if (confirm("Delete this paper?")) {
    papers = papers.filter(p => p.id !== id);
    activeTab = papers[0] ? papers[0].id : "apr";
    save();
    render();
  }
};

window.editAnswer = function(paperId, index) {
  const paper = papers.find(p => p.id === paperId);
  if (!paper) return;
  const newAns = prompt(`Q${index+1} currently ${paper.answers[index]}\nNew answer (A/B/C/D):`, paper.answers[index]);
  if (newAns && /^[A-D]$/i.test(newAns)) {
    paper.answers[index] = newAns.toUpperCase();
    save();
    render();
  }
};

window.showSettings = function() {
  document.getElementById("content").innerHTML = `
    <div class="paper-card" style="padding:20px;">
      <h3>GitHub Token (for editing)</h3>
      <input type="password" id="token-input" value="${config.token}" placeholder="Paste your token here" style="width:100%;padding:12px;margin:10px 0;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      <button class="btn" onclick="saveNewToken()">Save Token</button>
    </div>`;
};

window.saveNewToken = function() {
  config.token = document.getElementById("token-input").value.trim();
  saveConfig();
  showToast("Token saved. Trying to switch to edit mode...");
  setTimeout(() => loadFromGitHub(), 1000);
};

// Start App
loadConfig();
loadFromGitHub();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Nav Answer Keys</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d1b2a; --navy2: #152235; --navy3: #1e3050;
    --gold: #c9a84c; --cream: #f5f0e8; --red: #e05c5c;
  }
  body { background: var(--navy); color: var(--cream); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

  .header-title { font-family: 'Playfair Display', serif; font-size: 28px; text-align:center; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
  .tab { font-family: 'DM Mono', monospace; padding: 8px 16px; border-radius: 30px; border: 1px solid var(--navy3); background: transparent; color: #b0c0d0; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gold); color: #0d1b2a; }

  .paper-card { background: var(--navy2); border: 1px solid var(--navy3); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--navy3); }
  .answer-cell { background: var(--navy2); padding: 12px 6px; text-align: center; cursor: pointer; }
  .cell-num { font-size: 10px; color: #b0c0d0; }
  .cell-ans { font-size: 22px; font-weight: 600; color: var(--gold); }

  .btn, .small-btn { padding: 12px; background: var(--gold); color: #0d1b2a; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .btn-red { background: var(--red); color: white; }
  .small-btn { padding: 8px 14px; font-size: 13px; }

  .banner { padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
  .edit-banner { background: #4caf82; color: white; }
  .readonly-banner { background: #1e3050; color: #c9a84c; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 12px 24px; border-radius: 30px; z-index: 999; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header-title">General Navigation<br>Answer Keys</div>

  <div id="mode-banner" class="banner"></div>

  <div style="text-align:center; margin:10px 0 20px;">
    <button class="small-btn" onclick="showSettings()">⚙️ Settings</button>
    <button class="small-btn" onclick="forceRefresh()" style="margin-left:8px;">🔄 Force Refresh</button>
  </div>

  <div id="tabs"></div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== YOUR DETAILS ==============
const USERNAME = "Ayan1850";
const REPO = "QB-Answer-Key";

let config = { token: "" };
let papers = [];
let activeTab = "apr";
let editingPaperId = null;
let isReadOnly = true;

const SEED = [
  { id: 'apr', title: 'April Batch', code: 'GN-APR-2025', answers: ['C','C','C','B','D','C','B','C','B','B','B','D','C','D','D','A','D','D','B','B','C','D','D','D','B'] },
  { id: 'may', title: 'May Batch', code: 'GN-MAY-2025', answers: ['C','C','B','C','A','D','A','C','B','B','A','B','C','B','D','B','C','C','B','C'] }
];

function loadConfig() {
  const saved = localStorage.getItem("gennav_config");
  if (saved) config = JSON.parse(saved);
}

async function loadFromGitHub() {
  document.getElementById("mode-banner").innerHTML = `<div class="banner readonly-banner">Loading latest data...</div>`;

  // Try Edit Mode
  if (config.token) {
    try {
      const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/gennav-keys.json?ref=main`, {
        headers: { "Authorization": `token ${config.token}` }
      });
      if (res.ok) {
        const data = await res.json();
        papers = JSON.parse(atob(data.content));
        isReadOnly = false;
        document.getElementById("mode-banner").innerHTML = `<div class="banner edit-banner">✏️ Editing Mode Active - Changes Saved</div>`;
        render();
        return;
      }
    } catch(e) {}
  }

  // Public Mode
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/gennav-keys.json?t=${Date.now()}`);
    if (res.ok) papers = await res.json();
    else papers = [...SEED];
  } catch(e) {
    papers = [...SEED];
  }
  isReadOnly = true;
  document.getElementById("mode-banner").innerHTML = `<div class="banner readonly-banner">📖 Public View Mode</div>`;
  render();
}

async function saveToGitHub() {
  if (isReadOnly || !config.token) return false;
  try {
    let sha = null;
    try {
      const existing = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/gennav-keys.json?ref=main`, {
        headers: { "Authorization": `token ${config.token}` }
      });
      if (existing.ok) sha = (await existing.json()).sha;
    } catch(e) {}

    const content = btoa(JSON.stringify(papers, null, 2));

    await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/gennav-keys.json`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${config.token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Update ${new Date().toISOString()}`,
        content: content,
        sha: sha,
        branch: "main"
      })
    });
    showToast("✅ Saved Successfully");
    return true;
  } catch(e) {
    showToast("❌ Save Failed");
    console.error(e);
    return false;
  }
}

function save() {
  localStorage.setItem("gennav_papers", JSON.stringify(papers));
  saveToGitHub();
}

function parseAnswers(raw) {
  return raw.trim().split('\n').map(l => l.trim().match(/([A-D])/i)?.[1]?.toUpperCase()).filter(Boolean);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function forceRefresh() {
  showToast("Forcing refresh from GitHub...");
  loadFromGitHub();
}

// Render Functions (Full)
function render() { /* ... full render logic same as previous */ 
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  papers.forEach(p => {
    const b = document.createElement('button');
    b.className = `tab ${p.id === activeTab ? 'active' : ''}`;
    b.textContent = p.title;
    b.onclick = () => { activeTab = p.id; editingPaperId = null; render(); };
    tabs.appendChild(b);
  });

  const addBtn = document.createElement('button');
  addBtn.className = `tab ${activeTab === '__add__' ? 'active' : ''}`;
  addBtn.textContent = isReadOnly ? 'View Only' : '+ New Paper';
  if (!isReadOnly) addBtn.onclick = () => { activeTab = '__add__'; editingPaperId = null; render(); };
  tabs.appendChild(addBtn);

  const content = document.getElementById('content');
  if (activeTab === '__add__' || editingPaperId) {
    content.innerHTML = renderForm();
  } else {
    const paper = papers.find(p => p.id === activeTab);
    content.innerHTML = paper ? renderPaper(paper) : '<p style="text-align:center;padding:60px;color:#666;">No paper</p>';
  }
}

function renderPaper(paper) {
  const grid = paper.answers.map((ans, i) => `
    <div class="answer-cell" onclick="${isReadOnly ? '' : `editAnswer('${paper.id}', ${i})`}">
      <div class="cell-num">Q${i+1}</div>
      <div class="cell-ans">${ans}</div>
    </div>
  `).join('');

  return `
    <div class="paper-card">
      <div style="padding:16px;border-bottom:1px solid var(--navy3);">
        <strong>${paper.title}</strong><br><small>${paper.code} • ${paper.answers.length} Qs</small>
      </div>
      <div class="answer-grid">${grid}</div>
    </div>
    ${isReadOnly ? '' : `
      <button class="btn" onclick="startEdit('${paper.id}')">✏️ Edit Full Paper</button>
      <button class="btn btn-red" onclick="deletePaper('${paper.id}')">Delete Paper</button>
    `}
  `;
}

function renderForm() {
  const isEdit = !!editingPaperId;
  const paper = isEdit ? papers.find(p => p.id === editingPaperId) : null;
  return `
    <div class="paper-card" style="padding:20px;">
      <h3>${isEdit ? 'Edit Paper' : 'Add New Paper'}</h3>
      <input id="title" value="${paper?.title || ''}" placeholder="Batch Name" style="width:100%;padding:12px;margin:8px 0;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      <input id="code" value="${paper?.code || ''}" placeholder="Paper Code" style="width:100%;padding:12px;margin:8px 0;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      <textarea id="answers" rows="15" style="width:100%;padding:12px;margin:8px 0;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">${paper ? paper.answers.map((a,i) => `${i+1} ${a}`).join('\n') : ''}</textarea>
      <button class="btn" onclick="${isEdit ? 'updatePaper()' : 'addPaper()'}">${isEdit ? 'Update' : 'Save'}</button>
      ${isEdit ? `<button class="btn btn-red" onclick="cancelEdit()">Cancel</button>` : ''}
    </div>`;
}

// CRUD Functions
window.addPaper = function() { /* same as before */ 
  const title = document.getElementById('title').value.trim();
  const code = document.getElementById('code').value.trim();
  const raw = document.getElementById('answers').value;
  const answers = parseAnswers(raw);
  if (!title || answers.length === 0) return showToast("Fill all fields");
  const id = 'p_' + Date.now();
  papers.push({id, title, code: code || title, answers});
  save();
  activeTab = id;
  render();
  showToast("Paper Saved");
};

window.updatePaper = function() { /* same */ 
  const paper = papers.find(p => p.id === editingPaperId);
  paper.title = document.getElementById('title').value.trim();
  paper.code = document.getElementById('code').value.trim();
  paper.answers = parseAnswers(document.getElementById('answers').value);
  save();
  editingPaperId = null;
  render();
  showToast("Updated");
};

window.startEdit = function(id) { editingPaperId = id; activeTab = '__add__'; render(); };
window.cancelEdit = function() { editingPaperId = null; render(); };
window.deletePaper = function(id) {
  if (confirm("Delete?")) {
    papers = papers.filter(p => p.id !== id);
    activeTab = papers[0]?.id || "apr";
    save();
    render();
  }
};

window.editAnswer = function(paperId, index) {
  const paper = papers.find(p => p.id === paperId);
  const newAns = prompt(`Q${index+1}`, paper.answers[index]);
  if (newAns && /^[A-D]$/i.test(newAns)) {
    paper.answers[index] = newAns.toUpperCase();
    save();
    render();
  }
};

window.showSettings = function() {
  document.getElementById("content").innerHTML = `
    <div class="paper-card" style="padding:20px;">
      <h3>Token for Editing</h3>
      <input type="password" id="token-input" value="${config.token}" style="width:100%;padding:12px;margin:10px 0;background:var(--navy3);border:1px solid #334766;border-radius:8px;color:white;">
      <button class="btn" onclick="saveNewToken()">Save Token</button>
    </div>`;
};

window.saveNewToken = function() {
  config.token = document.getElementById("token-input").value.trim();
  localStorage.setItem("gennav_config", JSON.stringify(config));
  showToast("Token saved");
  setTimeout(() => loadFromGitHub(), 800);
};

// Start
loadConfig();
loadFromGitHub();
</script>
</body>
</html>
